[project]
name = "diecast-qa"
version = "0.1.0"
description = "다이캐스팅 공정 데이터를 활용한 불량 예측 모델 개발과 품질관리 방안"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ctgan>=0.13.0",
    "fastapi>=0.163.1",
    "imbalanced-learn>=0.14.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "optuna>=5.0.0",
    "pandas>=2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diecast_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
